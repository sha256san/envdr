[package]
name = "envdoctor"
version = "0.1.0"
edition = "2021"
authors = ["envdoctor team"]
description = "Diagnose and fix your developer environment with ease"
license = "MIT"
repository = "https://github.com/sha256san/envdr"
autobins = false
default-run = "envdr"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
colored = "2.1"
which = "6.0"
sysinfo = "0.30"
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }

[lib]
name = "envdoctor"
path = "src/lib.rs"

[[bin]]
name = "envdoctor"
path = "src/main.rs"

[[bin]]
name = "envdr"
path = "src/bin/envdr.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
