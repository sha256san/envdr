name: Multi-Platform Release & APT Repository

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-matrix:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            pkg_os: linux
            arch: x86_64
            deb_arch: amd64
            is_deb: true
            use_cross: false

          - name: Linux ARM64
            os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            pkg_os: linux
            arch: aarch64
            deb_arch: arm64
            is_deb: true
            use_cross: true

          - name: macOS Apple Silicon (arm64)
            os: macos-latest
            target: aarch64-apple-darwin
            pkg_os: darwin
            arch: arm64
            deb_arch: unknown
            is_deb: false
            use_cross: false

          - name: macOS Intel (x86_64)
            os: macos-latest
            target: x86_64-apple-darwin
            pkg_os: darwin
            arch: x86_64
            deb_arch: unknown
            is_deb: false
            use_cross: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools (Linux ARM64)
        if: matrix.use_cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build binary
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            RUSTFLAGS="-C linker=aarch64-linux-gnu-gcc" cargo build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Package artifacts
        run: |
          if [[ "${GITHUB_REF_NAME}" =~ ^v[0-9] ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(grep -m 1 '^version = ' Cargo.toml | cut -d '"' -f 2)
          fi
          DIST_DIR="dist_output"
          TMP_DIR="target/pkg_tmp"
          mkdir -p "${DIST_DIR}" "${TMP_DIR}"

          BIN_DIR="target/${{ matrix.target }}/release"
          PKG_NAME="envdr-v${VERSION}-${{ matrix.pkg_os }}-${{ matrix.arch }}"
          TAR_DIR="${TMP_DIR}/${PKG_NAME}"
          mkdir -p "${TAR_DIR}"

          cp "${BIN_DIR}/envdoctor" "${TAR_DIR}/"
          cp "${BIN_DIR}/envdr" "${TAR_DIR}/"
          cp README.md LICENSE CHANGELOG.md "${TAR_DIR}/"

          tar -czvf "${DIST_DIR}/${PKG_NAME}.tar.gz" -C "${TMP_DIR}" "${PKG_NAME}"
          cp "${DIST_DIR}/${PKG_NAME}.tar.gz" "${DIST_DIR}/envdoctor-v${VERSION}-${{ matrix.pkg_os }}-${{ matrix.arch }}.tar.gz"

          # Debian Package (.deb) (Linux only)
          if [ "${{ matrix.is_deb }}" = "true" ]; then
            DEB_DOC_DIR="${TMP_DIR}/deb_envdoctor"
            mkdir -p "${DEB_DOC_DIR}/DEBIAN" "${DEB_DOC_DIR}/usr/bin" "${DEB_DOC_DIR}/usr/share/doc/envdoctor"

            {
              echo "Package: envdoctor"
              echo "Version: ${VERSION}"
              echo "Section: devel"
              echo "Priority: optional"
              echo "Architecture: ${{ matrix.deb_arch }}"
              echo "Provides: envdr"
              echo "Replaces: envdr"
              echo "Maintainer: envdoctor team <sha256san@users.noreply.github.com>"
              echo "Homepage: https://github.com/sha256san/envdr"
              echo "Description: Automated Developer Environment Diagnostic & Health Check Tool"
              echo " envdoctor (envdr) diagnoses Python, Rust, Go, Node.js, C/C++, Docker, Git,"
              echo " GPU/CUDA/ROCm environments, identifies root causes of issues, and suggests"
              echo " actionable fixes."
            } > "${DEB_DOC_DIR}/DEBIAN/control"

            cp "${BIN_DIR}/envdoctor" "${DEB_DOC_DIR}/usr/bin/"
            cp "${BIN_DIR}/envdr" "${DEB_DOC_DIR}/usr/bin/"
            cp README.md LICENSE "${DEB_DOC_DIR}/usr/share/doc/envdoctor/"
            dpkg-deb --build "${DEB_DOC_DIR}" "${DIST_DIR}/envdoctor_${VERSION}_${{ matrix.deb_arch }}.deb"

            # Create alias package envdr
            DEB_DR_DIR="${TMP_DIR}/deb_envdr"
            mkdir -p "${DEB_DR_DIR}/DEBIAN" "${DEB_DR_DIR}/usr/bin"
            {
              echo "Package: envdr"
              echo "Version: ${VERSION}"
              echo "Section: devel"
              echo "Priority: optional"
              echo "Architecture: ${{ matrix.deb_arch }}"
              echo "Provides: envdoctor"
              echo "Replaces: envdoctor"
              echo "Maintainer: envdoctor team <sha256san@users.noreply.github.com>"
              echo "Homepage: https://github.com/sha256san/envdr"
              echo "Description: Automated Developer Environment Diagnostic & Health Check Tool (envdr alias)"
            } > "${DEB_DR_DIR}/DEBIAN/control"

            cp "${BIN_DIR}/envdr" "${DEB_DR_DIR}/usr/bin/"
            cp "${BIN_DIR}/envdoctor" "${DEB_DR_DIR}/usr/bin/"
            dpkg-deb --build "${DEB_DR_DIR}" "${DIST_DIR}/envdr_${VERSION}_${{ matrix.deb_arch }}.deb"
          fi

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.pkg_os }}-${{ matrix.arch }}
          path: dist_output/*

  release:
    name: Create Multi-Platform GitHub Release
    needs: build-matrix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: all_dist
          merge-multiple: true

      - name: Organize release files and compute checksums
        run: |
          mkdir -p dist docs/dist
          cp all_dist/* dist/ 2>/dev/null || true
          cp all_dist/*.tar.gz docs/dist/ 2>/dev/null || true

          cd dist
          sha256sum $(find . -maxdepth 1 -type f ! -name "SHA256SUMS.txt") > SHA256SUMS.txt
          cd ..

          # Generate APT Repo
          chmod +x scripts/create-apt-repo.sh
          ./scripts/create-apt-repo.sh || true

      - name: Create GitHub Release with all Platform Binaries
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            dist/*
          generate_release_notes: true

      - name: Upload APT Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/apt

  deploy-pages:
    needs: release
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
